# probe overrides for t7-forecast.fz job `probe` (docs/DECISIONS.md D2, D8):
# six tasks for now, each "happens in the next 24 h after the cut" (ICU + 24 h);
# a stay where it already happened before the cut gets no probability.
# Disabled for now (still flagged by icutwin-winnow, just not fit): ICU admission
# (always before the cut in an ICU cohort), NIPPV, high-flow, every lab/vital label.
# app/aggregate.py shows only the rows that have scores.
#   icutwin-rep-score <tokenized_output> -m <model> -c examples/probe_tasks.yaml
score:
  target_tokens:
    - ADT//TRANSFER_IN//ward # leaves the ICU to the ward (bed manager)
    - ADT//TRANSFER_IN//stepdown # leaves the ICU to stepdown (bed manager)
    - RESP//device_category//imv # ventilator (respiratory therapy)
    - LABEL//pressor_init # vasopressor start (pharmacy)
    - LABEL//crrt_init # CRRT start (ICU team)
    - HOSP//discharge_category//expired # death (ICU team)
