categorical:
- code: RESP//device_category
  table: respiratory_support
  column: device_category
  time_column: recorded_dttm
  mapping:
    IMV: imv
    NIPPV: nippv
    CPAP: cpap
    High Flow NC: high_flow_nc
    Face Mask: face_mask
    Trach Collar: trach_collar
    Nasal Cannula: nasal_cannula
    Room Air: room_air
    Other: other
  other: true
- code: RESP//mode_category
  table: respiratory_support
  column: mode_category
  time_column: recorded_dttm
  mapping:
    Assist Control-Volume Control: assist_control_volume_control
    Pressure Control: pressure_control
    Pressure-Regulated Volume Control: pressure_regulated_volume_control
    SIMV: simv
    Pressure Support/CPAP: pressure_support_cpap
    Volume Support: volume_support
    Blow by: other
    Other: other
  other: true
- code: RESP//tracheostomy_initiated
  table: respiratory_support
  column: tracheostomy
  time_column: recorded_dttm
  mapping:
    '1': present
    'yes': present
  ignore:
  - '0'
  - 'no'
  other: false
  flag: true
