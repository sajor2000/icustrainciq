%YAML 1.2
---
# icutwin-train defaults; a user file passed with -c is merged over this one, so it
# only needs the keys it changes
run_name: icutwin
size: m # s | m | l
max_seq_len: !!int 4096 # fixed context; also max_position_embeddings
losses: # auxiliary losses added to next-token CE (train only)
  tnt: # time to next token (tnt.py); head saved beside the model
    use: !!bool true
    weight: !!float 0.25
attn_implementation: sdpa # flash_attention_2 with the project `flash` extra
port: !!int 8765 # live metrics page on 127.0.0.1; 0 = off
seed: !!int 42

# layer design of NVIDIA Nemotron 3.5 Bolt E4B (Gemma4 text): 5 sliding-window
# layers then 1 full-attention layer (the last layer is always full), GQA, KV
# shared across the last layers, per-layer input embeddings, logit softcapping;
# trained from scratch on our vocabulary, at our sizes
model: # shared by every size
  head_dim: !!int 64
  full_every: !!int 6 # every 6th layer is full attention, the rest sliding
  sliding_window: !!int 512
  hidden_activation: gelu_pytorch_tanh
  final_logit_softcapping: !!float 30.0
  rms_norm_eps: !!float 1e-6
  tie_word_embeddings: !!bool true
  rope_parameters:
    full_attention: {rope_type: proportional, rope_theta: !!float 1000000.0, partial_rotary_factor: !!float 0.25}
    sliding_attention: {rope_type: default, rope_theta: !!float 10000.0}

sizes: # E4B ratios: kv-shared layers = 18/42 of the depth, per-layer input = hidden/10
  s: # 12.3M at |vocab| 1200
    hidden_size: !!int 256
    num_hidden_layers: !!int 12
    num_attention_heads: !!int 4
    num_key_value_heads: !!int 2
    intermediate_size: !!int 768
    num_kv_shared_layers: !!int 5
    hidden_size_per_layer_input: !!int 24
  m: # 35M
    hidden_size: !!int 384
    num_hidden_layers: !!int 16
    num_attention_heads: !!int 6
    num_key_value_heads: !!int 3
    intermediate_size: !!int 1152
    num_kv_shared_layers: !!int 7
    hidden_size_per_layer_input: !!int 32
  l: # 70M
    hidden_size: !!int 512
    num_hidden_layers: !!int 18
    num_attention_heads: !!int 8
    num_key_value_heads: !!int 4
    intermediate_size: !!int 1536
    num_kv_shared_layers: !!int 8
    hidden_size_per_layer_input: !!int 48

training_args: # HF TrainingArguments; bf16 is set automatically on CUDA
  per_device_train_batch_size: !!int 8 # packed 4096-token rows
  per_device_eval_batch_size: !!int 8
  num_train_epochs: !!int 3
  learning_rate: !!float 5e-4
  warmup_steps: !!float 0.02 # float = ratio of total steps (transformers 5 has no warmup_ratio)
  lr_scheduler_type: linear
  weight_decay: !!float 0.2
  gradient_accumulation_steps: !!int 1
  eval_strategy: steps
  eval_steps: !!float 0.1
  save_strategy: steps
  save_steps: !!float 0.1
  save_total_limit: !!int 1
  load_best_model_at_end: !!bool true
  metric_for_best_model: eval_loss # token loss on tuning (time loss excluded)
  greater_is_better: !!bool false
  prediction_loss_only: !!bool true
  remove_unused_columns: !!bool false
  label_names: [labels]
  logging_steps: !!int 10
  ddp_find_unused_parameters: !!bool false
  dataloader_num_workers: !!int 2
  report_to: none
