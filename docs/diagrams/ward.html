      <text x="40" y="752" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">How it works: the team writes 25 hospitalization ids into a file on the clif_work volume. t7-ward copies only those stays out of CLIF-MIMIC, tokenizes them and numbers the rooms in list order.</text>
      <text x="40" y="770" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Then every forecast, at 07:00 or on request, scores those 25 stays. The dispatcher runs with --real-ward, and the board shows the label Real MIMIC-IV · local only.</text>
