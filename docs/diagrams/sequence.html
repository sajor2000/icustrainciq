    <h1>At 07:00 the dispatcher starts the forecast by itself, retries for 10 minutes if it must, and the open board picks up the new numbers</h1>

      <text x="40" y="886" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Nobody presses anything. Fuzzball 4.3 has no cron, so the dispatcher is the clock: 07:00 America/Chicago, unit scope, demo clock 0, and the 20 minute gap does not apply.</text>
      <text x="40" y="904" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Retry: while a GPU workflow is running, the cluster cannot be listed, or the start fails, it tries again each minute for 10 minutes. Every attempt goes to runs.jsonl.</text>
