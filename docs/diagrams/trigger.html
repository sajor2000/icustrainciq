    <h1>One button, one POST, one Fuzzball workflow: how Update the unit becomes a refreshed board</h1>

      <text x="40" y="824" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Where it runs: everything in the Local Lenovo PGX zone is a Fuzzball service, job or volume on the two on-site Lenovo PGX (GB10) machines. Nothing is hosted in the cloud.</text>
      <text x="40" y="842" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">POST rule: Content-Type: application/json, X-Lookahead: 1, and an Origin that matches Host. Anything else gets 403 and nothing starts.</text>
      <text x="40" y="860" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Guards: one forecast at a time, 20 minutes between updates of the same scope. A refusal returns started false with a plain reason, shown word for word.</text>
      <text x="40" y="878" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">The copy: Fuzzball 4.3 has no parameters, so the dispatcher fills six tokens in t7-forecast.fz (@SCOPE@ @ROOM@ @HOURS@ @WARD_FLAG@ @CLIF_DIR@ @NAMES@) and starts the copy.</text>

      <text x="40" y="914" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Room variant: {scope: room, room: 12} rewrites that one room in rooms.json; forecast.json and made_at stay. Refused until a whole-unit run exists.</text>
