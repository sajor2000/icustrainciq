    <h1>One page, two tabs, a Now and Next 24 h switch, a room page and a chat widget: each part reads one or two calls</h1>

      <desc id="frontend-desc">The board page has a top bar, a Bed board tab, a Unit strain tab, a room page and the Ask Lookahead chat widget. The top bar reads run state from GET /api/runs and starts a unit update with POST /api/rerun; the Bed board reads GET /api/rooms; Unit strain reads GET /api/forecast and saves capacity with POST /api/capacity; the room page reads one room and updates it with POST /api/rerun at room scope; the chat posts to /api/ask. All calls go to the board service on the local Lenovo PGX machines.</desc>

      <text x="40" y="928" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Now is what runs at the 07:00 cut: on_now in rooms.json, read from raw CLIF tables by clif_now.py. Next 24 h is the forecast: p per room, and unit counts with 80% ranges.</text>
      <text x="40" y="946" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Statuses: Worsening, Watch, Not improving, Leaving, Steady. The page works them out from on_now and p. Chances show as percentages. Icons: ventilator, vasopressor, CRRT, leaving.</text>
      <text x="40" y="964" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Polling: /api/runs and /api/forecast every 30 seconds during a run, every 5 minutes otherwise. A new made_at reloads /api/rooms too. Every POST carries X-Lookahead: 1 and a JSON content type.</text>
      <text x="40" y="982" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">GET /api/capacity exists on the server; the page reads capacity from forecast.json instead. Opened from a file, or with #synthetic, the page makes its own demo data and calls nothing.</text>
