<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICU-Twin · Charge nurse journey</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1340px; width: 100%; min-width: 0; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ICU-Twin · User journey</p>
    <h1>The charge nurse's day: the verdict at 06:45, three rooms at rounds, one rerun when the unit changes</h1>
    <div class="diagram-container">
    <svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="journey-title journey-desc">
      <title id="journey-title">Charge nurse journey with the ICU-Twin board</title>
      <desc id="journey-desc">Five moments in a charge nurse's day with the board, from reading the verdict before rounds to rerunning the forecast at midday; confidence rises through rounds, drops when the unit changes and the morning forecast is stale, and recovers after the rerun.</desc>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <text x="220" y="40" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">06:45</text>
      <text x="220" y="62" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read the verdict</text>
      <text x="452" y="40" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">06:50</text>
      <text x="452" y="62" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Act on staffing</text>
      <text x="684" y="40" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">07:00</text>
      <text x="684" y="62" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Round on three rooms</text>
      <text x="916" y="40" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">12:30</text>
      <text x="916" y="62" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">The unit changes</text>
      <text x="1148" y="40" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">12:35</text>
      <text x="1148" y="62" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rerun the forecast</text>
      <line x1="112" y1="96" x2="1256" y2="96" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="100" y="100" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">HIGH</text>
      <line x1="112" y1="176" x2="1256" y2="176" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="100" y="180" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">NEUTRAL</text>
      <line x1="112" y1="256" x2="1256" y2="256" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="100" y="260" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">LOW</text>
      <polyline points="220,176 452,136 684,96" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="684,96 916,256" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="916,256 1148,136" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="220" cy="176" r="5" fill="#4f5d75"/>
      <circle cx="452" cy="136" r="5" fill="#4f5d75"/>
      <circle cx="684" cy="96" r="5" fill="#4f5d75"/>
      <circle cx="916" cy="256" r="5" fill="#bf4520"/>
      <circle cx="1148" cy="136" r="5" fill="#4f5d75"/>
      <line x1="112" y1="280" x2="1256" y2="280" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="112" y1="372" x2="1256" y2="372" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="112" y1="416" x2="1256" y2="416" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="100" y="312" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">ACTIONS</text>
      <text x="100" y="400" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">TOUCHPOINTS</text>
      <text x="100" y="444" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">OTHER TEAMS</text>
      <text x="220" y="304" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">Reads brief line 1:</text>
      <text x="220" y="322" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">ventilators TIGHT 3 (1–5)</text>
      <text x="452" y="304" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">Asks for a second RT</text>
      <text x="452" y="322" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">for the night shift</text>
      <text x="684" y="304" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">Opens rooms 20, 12, 7;</text>
      <text x="684" y="322" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">attending reads six bars</text>
      <text x="916" y="304" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">A code and two</text>
      <text x="916" y="322" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">admissions since 07:00</text>
      <text x="1148" y="304" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">Presses Rerun as</text>
      <text x="1148" y="322" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">ICU nurse (role only)</text>
      <rect x="816" y="336" width="200" height="20" rx="2" fill="rgba(191,69,32,0.08)" stroke="rgba(191,69,32,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="916" y="350" fill="#bf4520" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">MORNING FORECAST IS STALE</text>
      <text x="220" y="400" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">shift brief</text>
      <text x="452" y="400" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">unit rows · your row</text>
      <text x="684" y="400" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">room drawer · chips</text>
      <text x="916" y="400" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">run line · 06:30</text>
      <text x="1148" y="400" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Rerun · chat chip</text>
      <text x="220" y="440" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">Each role picks “I am”</text>
      <text x="220" y="458" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">and sees its own row</text>
      <text x="452" y="440" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">RT preps circuits;</text>
      <text x="452" y="458" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">pharmacy pre-mixes</text>
      <text x="684" y="440" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">Bed manager plans</text>
      <text x="684" y="458" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">departures</text>
      <text x="916" y="440" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">ED boarding builds;</text>
      <text x="916" y="458" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">counts are 6 h old</text>
      <text x="1148" y="440" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">All rows refresh</text>
      <text x="1148" y="458" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle">in a few minutes</text>
      <line x1="40" y1="488" x2="1240" y2="488" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="512" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND</text>
      <line x1="40" y1="532" x2="64" y2="532" stroke="#4f5d75" stroke-width="1.5"/><circle cx="52" cy="532" r="3" fill="#4f5d75"/>
      <text x="72" y="536" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Sentiment</text>
      <line x1="200" y1="532" x2="224" y2="532" stroke="#bf4520" stroke-width="1.5"/><circle cx="212" cy="532" r="3" fill="#bf4520"/>
      <text x="232" y="536" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Low point</text>
      <rect x="360" y="526" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="rgba(191,69,32,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="392" y="536" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Pain point</text>
      <text x="1240" y="536" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">One persona: the charge nurse. Synthetic numbers from the mockup.</text>
    </svg>
    </div>
  </div>

</html>
