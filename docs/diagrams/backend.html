    <h1>Three services, two workflows, four files: which module does what, and which Fuzzball service or job runs it</h1>
    <div class="diagram-container">

      <title id="backend-title">Backend modules, files and the Fuzzball objects that run them</title>
      <desc id="backend-desc">Inside the Fuzzball workflow t7-twin, service board runs board.py, chat_agent.py and the page, service dispatcher runs dispatcher.py and renders the t7-forecast template, and service nemotron runs vLLM. Setup workflows run first: t7-code publishes the code and packages, t7-fit runs the winnower, the extractor and the probe fit once per model, and t7-ward runs stage_ward.py and the tokenizer for the 25 rooms. Workflow t7-forecast runs the winnower and extractor on the GPU, then rooms.py, aggregate.py and clif_now.py on CPU. They hand off through twin-store, which holds rooms.json, forecast.json, capacity.json and runs.jsonl; the volume mimic_clif is only read, for the demo patients, the trained patient model and the training tokens.</desc>

      <text x="40" y="768" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Folders: backend/app (services, scoring glue), backend/icutwin (tokenizer, model, winnower, extractor, rep_based probes), backend/fuzzball (workflows; ready/ holds the rendered files).</text>
      <text x="40" y="786" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">twin-store also holds code/ and py/ (t7-code), probes/ and train/ (t7-fit) and stage/ (t7-ward, t7-forecast). There is no other volume to write to.</text>
      <text x="40" y="804" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">The two services use the Python standard library only. The scoring jobs import icutwin with polars, transformers and scikit-learn.</text>
      <text x="40" y="822" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Each JSON file is written to a temporary name, then renamed, so a reader never sees half a file. forecast.json is written last; the page watches its made_at.</text>
      <text x="40" y="840" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">chat_agent.py runs inside service board. Its tools read the same three JSON files and can ask the dispatcher for a run, only on an explicit ask.</text>
      <text x="40" y="858" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Where it runs: on the two on-site Lenovo PGX machines under Fuzzball. On a developer laptop, board.py alone runs with uv against examples/. Nothing is hosted in the cloud.</text>
