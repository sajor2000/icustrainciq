      <desc id="arch-train-desc">Training ran once as four CIQ Fuzzball workflows on two Lenovo ThinkStation PGX workstations, each with one NVIDIA GB10 (20 Arm cores, 128 GB, one GPU). Job 1 copies CLIF records in through the object cache (1 core, 2 GiB). Job 2 tokenizes them into the custom 1,231-token vocabulary (20 cores, 110 GiB). Job 3 trains the GEM, an NVIDIA Nemotron 3.5 Bolt E4B backbone, from scratch with PyTorch distributed data parallel on two nodes with one GPU each (20 cores, 110 GiB per node). Job 3.1 packages and load-tests the checkpoint (2 cores, 4 GiB). Job 4 embeds patients on both GPUs and fits six probes on CPU (20 cores, 90 GiB). Tokens, the GEM and the probes are saved on the 200 GB mimic_clif VAST volume.</desc>
