      <desc id="arch-train-desc">Run once on two Lenovo ThinkStation PGX workstations (node A, CIQ-CHI-SPARK13; node B, CIQ-CHI-SPARK14), each one NVIDIA GB10. Job 1 moves CLIF records in on node A (CPU). Job 2 tokenizes them into the custom 1,231-token vocabulary on node B (CPU). Job 3, the one training workflow, trains the GEM, an NVIDIA Nemotron E4B backbone, from scratch with PyTorch DDP across both nodes, one GPU each. Job 3.1 packages and load-tests the checkpoint on node A. Job 4 embeds patients on both GPUs and fits six linear probes. Tokens, the GEM and the probes are saved on the 200 GB mimic_clif VAST volume.</desc>
