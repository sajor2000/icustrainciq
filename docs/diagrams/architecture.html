    <h1>Train once, then one workflow runs the board</h1>

      <title id="architecture-title">ICU Horizon architecture</title>
      <desc id="architecture-desc">On two Lenovo ThinkStation PGX machines run by CIQ Fuzzball 4.3: jobs 1 to 4 train our model once on both GPUs from CLIF data that comes in through the object cache and save it with six probes to the mimic_clif volume. Job 5 loads the code, runs our model and probes on one GPU, and writes rooms.json and forecast.json to the twin-store volume. The board server reads them and serves the clinician's browser; it asks NVIDIA Nemotron 3 Nano on llama.cpp, whose weights are on hfcache, to answer chat questions. The volumes are on VAST storage.</desc>
