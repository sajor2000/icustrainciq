    <h1>One page, one board server, one dispatcher, and Fuzzball workflows on two GB10 nodes; patient rows stay inside the cluster</h1>

      <title id="architecture-title">Lookahead technical architecture</title>
      <desc id="architecture-desc">The board page in the browser talks over HTTPS to the board server, the only door into the cluster; the board server holds the chat agent, which calls Nemotron 3 Nano with tools, and asks the dispatcher to run or report; the dispatcher starts a rendered copy of the t7-forecast workflow, whose precheck, extract and score jobs read the cohort and the patient model from mimic_clif and write forecast.json and rooms.json to the twin-store volume that the board server reads; setup workflows t7-code, t7-fit and t7-ward publish the code, fit the probes and stage the 25 rooms; the volume mimic_clif is only read and holds the demo patients and the trained patient model; everything written goes to the one volume twin-store; patient rows stay inside the cluster.</desc>

      <text x="40" y="768" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Where it runs: everything in the Local Lenovo PGX zone is a Fuzzball service, job or volume on the two on-site Lenovo PGX (GB10) machines. Nothing is hosted in the cloud.</text>
      <text x="40" y="786" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Patient rows never leave the cluster. The browser receives unit counts and the stage-ward room entries. Default ward: open MIMIC-IV Demo; real MIMIC-IV only with --real-ward, local only.</text>
      <text x="40" y="804" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Two models, two GPUs. NVIDIA Nemotron 3 Nano, used as is, holds GPU 1 while t7-twin is up. The patient model, trained by us, runs in each t7-forecast job on GPU 2 for minutes.</text>
      <text x="40" y="822" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">The page has two tabs, Bed board and Unit strain, and a Now | Next 24 h switch. Now is life support running at 07:00, read from raw CLIF tables (clif_now.py). Next 24 h is the forecast.</text>
      <text x="40" y="840" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Three volumes. mimic_clif exists and is only read: the 25 demo patients with fictional names, the trained patient model, training tokens. twin-store is the one volume to create. hfcache exists.</text>
      <text x="40" y="858" fill="#5a6580" font-size="12" font-family="'Geist', sans-serif">Five predictions, 07:00 to 07:00: IMV, vasopressor, CRRT, leaving the ICU, death. twin-store also holds tokens and per-stay scores, so treat it as restricted; the board serves only the JSON files.</text>
