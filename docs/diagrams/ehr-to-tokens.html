      <desc id="ehr-to-tokens-desc">Left to right: charted EHR values from CLIF tables (time, heart rate, mean arterial pressure, PEEP on the ventilator, norepinephrine dose) become event tokens in a custom 1,231-token vocabulary, each value binned into one of ten bins. The GEM, an NVIDIA Nemotron E4B backbone trained from scratch with a next-token objective, reads a patient's tokens once; its last hidden state is 384 numbers. Six linear probes on that state give five 24-hour chances. Values are illustrative.</desc>
