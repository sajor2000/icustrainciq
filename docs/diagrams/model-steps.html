      <desc id="model-steps-desc">Four steps, left to right. One: train the GEM, a generative event model, a 36-million-parameter decoder trained from scratch on 1,231 ICU event tokens. Two, highlighted: one forward pass per patient; the last hidden layer is a 384-dimensional patient embedding. Three: six logistic-regression probes turn the embedding into 24-hour event probabilities. Four: the NVIDIA Nemotron 3.5 Bolt E4B chat explains the forecast through read-only tools and predicts nothing.</desc>
