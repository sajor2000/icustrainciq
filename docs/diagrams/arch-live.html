    <h1>The live app: job 5 and two services</h1>

      <title id="arch-live-title">ICU Horizon live on CIQ Fuzzball</title>
      <desc id="arch-live-desc">The live app is one CIQ Fuzzball workflow, job 5 (t7-launch). Load checks inputs on node B (CPU, 7 s). Infer runs the GEM and its probes on node B's GPU (35 s). Score adds up beds and the unit on node A (CPU, 33 s) and writes rooms.json and forecast.json to the twin-store VAST volume. The bed board service on node A reads those files and serves the ICU team over HTTPS; its chat agent calls read-only tools on the same files and sends the tool results to the chat model, NVIDIA Nemotron 3.5 Bolt E4B on llama.cpp on node B's GPU, whose only volume is hfcache with its weights. Nemotron never reads patient records; it knows what is happening to a patient only from the GEM's forecast passed in as tool results.</desc>
