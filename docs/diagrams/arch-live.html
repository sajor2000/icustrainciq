    <h1>The live app: job 5 and two services</h1>

      <desc id="arch-live-desc">The live app is one CIQ Fuzzball workflow, job 5 (t7-launch), on the same two NVIDIA GB10 workstations. Load checks the code, the GEM and the 25 patients (2 cores, 8 GB, 7 s). Infer runs the GEM and its probes on one GPU (8 cores, 48 GB, 35 s). Score adds up beds and the unit (4 cores, 16 GB, 33 s) and writes the forecast to the 20 GB twin-store VAST volume. Two services stay up: the bed board (python 3.12, 2 cores, 4 GB) serves clinicians over HTTPS, and the chat, NVIDIA Nemotron 3.5 Bolt E4B in 4-bit on llama.cpp (one GPU, 8 cores, 32 GB, weights on hfcache), answers questions through tools.</desc>
