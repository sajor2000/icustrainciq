      <title id="architecture-print-title">ICU Horizon on CIQ Fuzzball, job by job</title>
      <desc id="architecture-print-desc">Every CIQ Fuzzball 4.3 job and service on two Lenovo ThinkStation PGX workstations, each with one NVIDIA GB10 (20 Arm cores, about 128 GB memory, one GPU). Train once: job 1 copies health records in through the object cache (1 core), job 2 tokenizes them (20 cores, 110 GiB), job 3 trains the GEM, a generative event model, from scratch with PyTorch distributed data parallel on two nodes with one GB10 GPU each, job 3.1 packages and load-tests the checkpoint (2 cores), job 4 embeds patients on two GPUs and fits six probes on CPU; the GEM and probes are saved to the 200 GB mimic_clif VAST volume. Job 5: load checks inputs (2 cores, 8 GB, 7 s), infer runs the GEM and probes for 25 patients on one GPU (8 cores, 48 GB, 35 s), score adds up beds and the unit (4 cores, 16 GB, 33 s) and writes the forecast to the 20 GB twin-store volume. Services: the bed board (python 3.12, 2 cores, 4 GB, port 8080 behind an HTTPS endpoint) and the chat, NVIDIA Nemotron 3.5 Bolt E4B in 4-bit GGUF on llama.cpp (one GPU, 8 cores, 32 GB), with weights on the hfcache volume.</desc>
