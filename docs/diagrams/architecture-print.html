    <h1>Train once, then one workflow runs the board</h1>

      <title id="architecture-print-title">ICU Horizon architecture, print</title>
      <desc id="architecture-print-desc">On two Lenovo ThinkStation PGX machines run by CIQ Fuzzball 4.3: jobs 1 to 4 train our model once on both GPUs and save it with six probes to the mimic_clif volume. Job 5 reads it, runs one pass per patient on one GPU and writes the forecast to the twin-store volume. The board server reads the forecast for the clinician's browser and asks NVIDIA Nemotron 3 Nano on vLLM, whose weights are on hfcache, to answer chat questions. The volumes are on VAST storage; the object cache is the only way in or out.</desc>
