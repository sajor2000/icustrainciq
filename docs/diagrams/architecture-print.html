    <h1>Train once on two GPUs, then one workflow runs the board</h1>
    <div class="diagram-container">

      <title id="architecture-print-title">ICU Horizon on CIQ Fuzzball, job by job</title>
      <desc id="architecture-print-desc">Inside CIQ Fuzzball 4.3 on two Lenovo ThinkStation PGX machines. Train once: job 1 moves health records in through the object cache (CPU), job 2 tokenizes them (CPU), job 3 trains the GEM, a generative event model with the NVIDIA Nemotron 3.5 Bolt E4B layer design, from scratch on both GPUs, job 3.1 packages it (CPU) and job 4 fits six probes on its hidden states (two GPUs, then CPU); the model and probes go to the mimic_clif volume. Run the board, job 5: load checks inputs (CPU), infer runs the GEM and probes on one GPU, score adds up beds and the unit (CPU) and writes the forecast to twin-store; the bed board service reads it and asks NVIDIA Nemotron 3 Nano on llama.cpp on one GPU, with weights on hfcache, to answer chat questions. The volumes are on VAST storage.</desc>
